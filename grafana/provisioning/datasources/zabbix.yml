apiVersion: 1
datasources:
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-dashboard:8080/api_jsonrpc.php
    isDefault: true
    editable: true
    jsonData:
      authType: token
      trends: true
      trendsFrom: "30d"
      trendsRange: "30d"
      cacheTTL: "1h"
      timeout: 30
    secureJsonData:
      apiToken: $ZABBIX_API_TOKEN
